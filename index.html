<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Scripts may load only from this origin and jsDelivr. Without this, any
      injected <script src> could pull code from an arbitrary host.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self'" />

    <title>Confluence Wiki Viewer</title>

    <!-- Sanitiser -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="toolbar">
    <div class="left-tools">
        <input type="file" id="fileInput" accept=".wiki,.txt" hidden />
        <button id="uploadBtn">Upload .wiki / .txt</button>
        <select id="mermaidVersion" title="Mermaid version">
            <option value="10.8.0">Mermaid 10.8</option>
            <option value="11.2.0">Mermaid 11.2</option>
            <option value="11.4.0">Mermaid 11.4</option>
            <option value="latest" selected>Mermaid Latest</option>
        </select>
        <button id="toggleRaw">Toggle Raw</button>
        <button id="downloadPdfBtn">Download PDF</button>
    </div>
    <div class="right-tools">
        <button id="themeToggle">Theme</button>
    </div>
</header>

<main class="container">
    <div id="dropZone" class="preview-pane">
        <div id="preview"></div>
    </div>
    <textarea id="rawMarkdown" class="raw-pane hidden" placeholder="Paste Confluence wiki markup here..."></textarea>
</main>

<div id="processingIndicator" class="processing-indicator hidden" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <span class="spinner" aria-hidden="true"></span>
    <span id="processingText">Processing...</span>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
