spring.application.name=personal-docs
server.port=8080

# Path where .wiki / .md documents are stored.
# Defaults to a "docs" folder next to the jar; override with -Ddocs.storage-path=/your/path
docs.storage-path=${user.home}/personal-docs/docs

# Allow large wiki documents
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
